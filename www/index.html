<!doctype html>
<html lang="fr-CA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFEDE5">
<meta name="description" content="Care — Croissance, Activité, Rendez-vous, Éveil : le carnet de l'enfant de 0 à 18 ans">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}
</style>
<title>Care</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Figtree:wght@400;500;600;700&family=Outfit:wght@400;500;600;700&display=swap">
<style>
/* Layout : coquille d'app — barre latérale (desktop) / onglets en bas (mobile), cartes douces.
   L'ambiance (décor de fond, illustration, typo, arrondis) change avec le stade de l'enfant via [data-stage]. */
:root{
  --bg:#F6F4FB; --surface:#FFFFFF; --surface2:#F0EDF8; --line:#E4DFF0;
  --ink:#2A2340; --muted:#736B8A; --soft:#A39BB8;
  --peach:#FF9E7A; --peach-ink:#B24A22; --peach-bg:#FFEDE5;
  --mint:#62C9A4; --mint-ink:#1E7A58; --mint-bg:#E2F6EE;
  --butter:#FFD36E; --butter-ink:#8A6200; --butter-bg:#FFF5D9;
  --sky:#7DB8F7; --sky-ink:#1F5E9E; --sky-bg:#E3F0FE;
  --lilac:#A994F2; --lilac-ink:#5A3FB8; --lilac-bg:#EEE9FD;
  --rose:#F47FA3; --rose-ink:#A3264F; --rose-bg:#FDE6EE;
  --danger:#E0465E; --danger-bg:#FDE7EA;
  --kid:var(--peach); --kid-bg:var(--peach-bg); --kid-ink:var(--peach-ink);
  --shadow:0 1px 2px rgba(42,35,64,.06),0 8px 24px -12px rgba(42,35,64,.18);
  --glass:rgba(255,255,255,.82);
  --display:"Fredoka","Trebuchet MS",system-ui,sans-serif;
  --body:"Figtree","Segoe UI",system-ui,-apple-system,sans-serif;
  --r-lg:22px; --r-md:16px; --deco-op:.55;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#17141F; --surface:#221E2E; --surface2:#2B2639; --line:#383148;
  --ink:#F3F0FA; --muted:#B0A8C6; --soft:#7F7896;
  --peach-ink:#FFB89E; --peach-bg:#3A2A2A; --mint-ink:#8EE3C2; --mint-bg:#1E3530;
  --butter-ink:#FFD98A; --butter-bg:#38311F; --sky-ink:#A9D0FB; --sky-bg:#1F2D40;
  --lilac-ink:#C9BBFA; --lilac-bg:#2D2645; --rose-ink:#F9A9C2; --rose-bg:#3B2230;
  --danger:#FF7186; --danger-bg:#3D2027; --glass:rgba(34,30,46,.85); --deco-op:.28;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px -14px rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#17141F; --surface:#221E2E; --surface2:#2B2639; --line:#383148;
  --ink:#F3F0FA; --muted:#B0A8C6; --soft:#7F7896;
  --peach-ink:#FFB89E; --peach-bg:#3A2A2A; --mint-ink:#8EE3C2; --mint-bg:#1E3530;
  --butter-ink:#FFD98A; --butter-bg:#38311F; --sky-ink:#A9D0FB; --sky-bg:#1F2D40;
  --lilac-ink:#C9BBFA; --lilac-bg:#2D2645; --rose-ink:#F9A9C2; --rose-bg:#3B2230;
  --danger:#FF7186; --danger-bg:#3D2027; --glass:rgba(34,30,46,.85); --deco-op:.28;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px -14px rgba(0,0,0,.6); color-scheme:dark}
/* Ados : typo plus géométrique, arrondis plus sobres */
:root[data-stage="ado"]{ --display:"Outfit","Segoe UI",system-ui,sans-serif; --r-lg:16px; --r-md:12px }
:root[data-stage="scol"]{ --r-lg:18px }

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--display);font-weight:600;margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:1.75rem;line-height:1.15} h2{font-size:1.2rem} h3{font-size:1.02rem;font-weight:600}
p{margin:0}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .small{font-size:.86rem} .tiny{font-size:.76rem}
.eyebrow{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--muted)}
a{color:var(--kid-ink)}
:focus-visible{outline:3px solid var(--lilac);outline-offset:2px;border-radius:8px}

/* décor de fond selon l'âge */
.deco{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:var(--deco-op)}
.deco svg{width:100%;height:100%;display:block}

/* shell */
.app{position:relative;z-index:1;display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100%;max-width:1240px;margin:0 auto}
.side{position:sticky;top:0;height:100vh;padding:24px 14px;display:flex;flex-direction:column;gap:18px}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px}
.brand b{font-family:var(--display);font-size:1.45rem;font-weight:700;letter-spacing:-.02em}
.navlist{display:flex;flex-direction:column;gap:4px}
.nav-btn{display:flex;align-items:center;gap:12px;padding:11px 12px;border:0;background:none;border-radius:14px;cursor:pointer;color:var(--muted);font-weight:600;text-align:left}
.nav-btn svg{width:22px;height:22px;flex:none}
.nav-btn:hover{background:var(--surface2);color:var(--ink)}
.nav-btn[aria-current="page"]{background:var(--kid-bg);color:var(--kid-ink)}
.main{min-width:0;padding-block:20px 120px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}
.bottom{display:none}
@media (max-width:820px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{display:none}
  .main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 110px}
  .bottom{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
  .bottom .nav-btn{flex-direction:column;gap:2px;font-size:.7rem;padding:7px 2px;justify-content:center;align-items:center;text-align:center}
}

/* topbar */
.top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.kids{display:flex;gap:8px;overflow-x:auto;flex:1;min-width:0;padding:2px;scrollbar-width:none}
.kid-pill{display:flex;align-items:center;gap:8px;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 14px 4px 4px;cursor:pointer;white-space:nowrap;font-weight:600}
.kid-pill[aria-pressed="true"]{border-color:var(--kid);background:var(--kid-bg);color:var(--kid-ink)}
.add-kid{border:1.5px dashed var(--soft);background:var(--surface);border-radius:999px;padding:6px 14px;cursor:pointer;color:var(--muted);font-weight:600;white-space:nowrap}
.icon-btn{width:40px;height:40px;border-radius:14px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer;flex:none;padding:0}
.icon-btn svg{width:20px;height:20px}
.icon-btn.flat{border:0;background:none;width:32px;height:32px}
.avatar{flex:none;border-radius:50%}
img.avatar{object-fit:cover}

/* cards */
.grid{display:grid;gap:14px;grid-template-columns:repeat(12,minmax(0,1fr))}
.c12{grid-column:span 12}.c8{grid-column:span 8}.c7{grid-column:span 7}.c6{grid-column:span 6}.c5{grid-column:span 5}.c4{grid-column:span 4}
@media (max-width:1000px){.c4{grid-column:span 6}.c8,.c7,.c5{grid-column:span 12}}
@media (max-width:640px){.c4,.c6{grid-column:span 12}}
.card{background:var(--surface);border-radius:var(--r-lg);padding:18px;box-shadow:var(--shadow);min-width:0;display:flex;flex-direction:column;gap:12px}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.tint{background:var(--kid-bg);box-shadow:none}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:10px}
.between{justify-content:space-between}

/* hero */
.hero{position:relative;overflow:hidden;background:var(--kid-bg);border-radius:calc(var(--r-lg) + 6px);padding:22px;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:18px;align-items:center}
.hero h1{font-size:clamp(1.6rem,4vw,2.2rem)}
.hero .age{font-family:var(--display);font-size:1.12rem;color:var(--kid-ink);font-weight:500}
.hero-illu{width:150px;height:120px;flex:none}
@media (max-width:640px){.hero{grid-template-columns:auto minmax(0,1fr)}.hero-illu{display:none}}
@media (max-width:420px){.hero{grid-template-columns:1fr}}

.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:.78rem;font-weight:700;background:var(--surface2);color:var(--muted);white-space:nowrap}
.chip.peach{background:var(--peach-bg);color:var(--peach-ink)}.chip.mint{background:var(--mint-bg);color:var(--mint-ink)}
.chip.butter{background:var(--butter-bg);color:var(--butter-ink)}.chip.sky{background:var(--sky-bg);color:var(--sky-ink)}
.chip.lilac{background:var(--lilac-bg);color:var(--lilac-ink)}.chip.rose{background:var(--rose-bg);color:var(--rose-ink)}
.chip.danger{background:var(--danger-bg);color:var(--danger)}
button.chip{border:0;cursor:pointer}
button.chip[aria-pressed="false"]{opacity:.5;text-decoration:line-through}

.stat{display:flex;flex-direction:column;gap:2px;min-width:0}
.stat .v{font-family:var(--display);font-size:1.5rem;font-weight:600;line-height:1.1}
.stat .v small{font-size:.85rem;color:var(--muted);font-weight:500;margin-left:2px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:14px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:14px;padding:10px 16px;font-weight:700;cursor:pointer;background:var(--ink);color:var(--surface);text-decoration:none}
.btn.kid{background:var(--kid);color:#2A1A10}
.btn.ghost{background:var(--surface2);color:var(--ink)}
.btn.line{background:none;border:1.5px solid var(--line);color:var(--ink)}
.btn.danger{background:var(--danger-bg);color:var(--danger)}
.btn.sm{padding:6px 11px;border-radius:11px;font-size:.85rem}
.btn svg{width:18px;height:18px}

.quick{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:10px}
.qbtn{border:0;border-radius:18px;padding:14px 8px 12px;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;font-weight:700;font-size:.86rem;transition:transform .15s}
.qbtn:hover{transform:translateY(-2px)} .qbtn:active{transform:scale(.97)}
.qbtn svg{width:30px;height:30px}
@media (prefers-reduced-motion:reduce){.qbtn,.qbtn:hover{transition:none;transform:none}}

.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line);min-width:0}
.li:first-child{border-top:0}
.li .grow{flex:1;min-width:0}
.ic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;flex:none}
.ic svg{width:20px;height:20px}
.li-title{font-weight:600;overflow-wrap:anywhere}
button.li{border-left:0;border-right:0;border-bottom:0;background:none;text-align:left;cursor:pointer;width:100%}

.seg{display:flex;gap:4px;background:var(--surface2);padding:4px;border-radius:14px;overflow-x:auto;scrollbar-width:none;max-width:100%}
.seg button{border:0;background:none;padding:7px 13px;border-radius:10px;font-weight:700;color:var(--muted);cursor:pointer;white-space:nowrap;font-size:.88rem}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.1)}

.banner{border-radius:var(--r-md);padding:12px 14px;display:flex;gap:10px;align-items:flex-start;font-size:.9rem}
.banner>svg{width:20px;height:20px;flex:none;margin-top:1px}
.banner.info{background:var(--sky-bg);color:var(--sky-ink)}
.banner.warn{background:var(--butter-bg);color:var(--butter-ink)}
.banner.alert{background:var(--danger-bg);color:var(--danger)}
.banner.ok{background:var(--mint-bg);color:var(--mint-ink)}
.banner ul{margin:4px 0 0;padding-left:18px}
.tipcard{border-radius:var(--r-md);padding:12px 14px;display:flex;flex-direction:column;gap:3px}

/* forms */
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field>label{font-size:.8rem;font-weight:700;color:var(--muted)}
.inp{width:100%;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px;min-width:0}
.inp:focus{outline:none;border-color:var(--kid)}
textarea.inp{min-height:70px;resize:vertical}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
.radio-row{display:flex;gap:6px;flex-wrap:wrap}
.radio-row label{display:inline-flex}
.radio-row input{position:absolute;opacity:0;pointer-events:none}
.radio-row span{padding:7px 13px;border-radius:11px;border:1.5px solid var(--line);font-weight:600;cursor:pointer;font-size:.88rem}
.radio-row input:checked+span{border-color:var(--kid);background:var(--kid-bg);color:var(--kid-ink)}
.radio-row input:focus-visible+span{outline:3px solid var(--lilac)}

.switch{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line);cursor:pointer}
.switch:first-child{border-top:0}
.switch input{position:absolute;opacity:0;pointer-events:none}
.switch .tg{width:44px;height:26px;border-radius:99px;background:var(--line);position:relative;flex:none;transition:background .15s}
.switch .tg::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.25);transition:left .15s}
.switch input:checked+.tg{background:var(--kid)}
.switch input:checked+.tg::after{left:21px}
.switch input:focus-visible+.tg{outline:3px solid var(--lilac)}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(23,18,36,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:min(580px,100%);max-height:92vh;overflow:auto;border-radius:26px 26px 0 0;padding:20px max(18px,env(safe-area-inset-right,0px)) calc(22px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px;animation:up .22s ease-out}
.sheet-grab{width:44px;height:5px;border-radius:9px;background:var(--line);align-self:center;margin-top:-6px}
@media (min-width:821px){.scrim{align-items:center}.sheet{border-radius:26px}}
@keyframes up{from{transform:translateY(30px);opacity:.4}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--surface);padding:10px 18px;border-radius:999px;font-weight:700;z-index:60;font-size:.9rem;box-shadow:var(--shadow)}

.timer{display:flex;align-items:center;gap:12px;background:var(--lilac-bg);color:var(--lilac-ink);border-radius:var(--r-md);padding:10px 12px}
.timer .t{font-family:var(--display);font-size:1.4rem;font-weight:600}
.pulse{width:10px;height:10px;border-radius:50%;background:var(--lilac);animation:pl 1.4s infinite;flex:none}
@keyframes pl{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.pulse{animation:none}}

/* chart */
.chart-wrap{overflow-x:auto;margin:0 -4px}
.chart-wrap svg{display:block;width:100%;min-width:320px;height:auto}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.78rem;color:var(--muted)}
.legend i{display:inline-block;width:18px;height:3px;border-radius:3px;vertical-align:middle;margin-right:5px}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th{font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:left;font-weight:700;padding:6px 8px}
td{padding:9px 8px;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}
.tbl{overflow-x:auto}

/* rings bien-être */
.rings{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px}
.ring{display:flex;align-items:center;gap:10px;background:var(--surface2);border-radius:var(--r-md);padding:10px 12px;min-width:0}
.ring svg{width:52px;height:52px;flex:none}
.ring .v{font-family:var(--display);font-weight:600;font-size:1.1rem;line-height:1.1}

/* vaccins */
.vgroup{display:grid;grid-template-columns:96px minmax(0,1fr);gap:14px;padding:14px 0;border-top:1px dashed var(--line)}
.vgroup:first-child{border-top:0}
.vage{font-family:var(--display);font-weight:600;font-size:1.05rem;line-height:1.2}
.vdose{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:12px;background:var(--surface2);flex-wrap:wrap}
.vdose+.vdose{margin-top:6px}
.vdose .grow{flex:1;min-width:150px}
@media (max-width:520px){.vgroup{grid-template-columns:1fr;gap:6px}}

/* jalons */
.ms{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-top:1px solid var(--line)}
.ms:first-child{border-top:0}
.check{width:26px;height:26px;border-radius:9px;border:2px solid var(--soft);background:none;flex:none;cursor:pointer;display:grid;place-items:center;padding:0}
.check[aria-checked="true"]{background:var(--mint);border-color:var(--mint)}
.check svg{width:16px;height:16px;color:#fff}
.dom{font-size:.7rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase}
.tl-row{display:grid;grid-template-columns:26px minmax(0,1fr);gap:10px;padding:9px 0;border-top:1px solid var(--line);align-items:start}
.tl-row:first-of-type{border-top:0}
.track{position:relative;height:14px;border-radius:7px;background:var(--surface2);margin-top:6px}
.track .bar{position:absolute;top:2px;bottom:2px;border-radius:5px}
.track .now{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink);border-radius:2px}
.track .flag{position:absolute;top:-3px;width:3px;height:20px;background:var(--danger);border-radius:2px}
.axis{position:relative;height:16px;margin-left:36px;font-size:.7rem;color:var(--muted)}
.axis span{position:absolute;transform:translateX(-50%);white-space:nowrap}
.dombar{height:8px;border-radius:5px;background:var(--surface2);overflow:hidden}
.dombar i{display:block;height:100%;border-radius:5px}

/* calendrier */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .dow{font-size:.72rem;font-weight:700;color:var(--muted);text-align:center;padding:4px 0}
.day{aspect-ratio:1/1;max-width:100%;border:0;border-radius:12px;background:var(--surface2);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:6px 2px;gap:3px;font-weight:600;font-size:.88rem;min-width:0}
.day.out{background:none;color:var(--soft)}
.day.today{outline:2px solid var(--kid);outline-offset:-2px}
.day.sel{background:var(--kid);color:#2A1A10}
.dots{display:flex;gap:2px;flex-wrap:wrap;justify-content:center}
.dots i{width:6px;height:6px;border-radius:50%}

.tooth{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:8px;align-items:center;padding:8px 10px;border-radius:12px;background:var(--surface2)}
.tbtn{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:5px 10px;font-weight:700;font-size:.8rem;cursor:pointer}
.tbtn[aria-pressed="true"]{background:var(--mint);border-color:var(--mint);color:#0E3B2A}

.empty{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;padding:22px 10px;color:var(--muted)}
.empty svg{width:56px;height:56px}
.sep{height:1px;background:var(--line)}
.kbd-num{font-family:var(--display);font-weight:600}
.pre{white-space:pre-wrap;font-size:.86rem;background:var(--surface2);border-radius:14px;padding:14px;max-height:420px;overflow:auto;font-variant-numeric:tabular-nums}

/* ---------- utilitaires ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid = () => Math.random().toString(36).slice(2, 10);
const DAY = 864e5, MONTH_DAYS = 30.4375;
const pad = n => String(n).padStart(2, "0");
const iso = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseD = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y, m-1, d); };
const today = () => { const d = new Date(); d.setHours(0,0,0,0); return d; };
const addMonths = (d, m) => { const r = new Date(d); r.setMonth(r.getMonth() + m); return r; };
const addDays = (d, n) => { const r = new Date(d); r.setDate(r.getDate() + n); return r; }; // sûr lors des changements d'heure
const fmtD = (s, opt={day:"numeric",month:"short",year:"numeric"}) => (typeof s==="string"?parseD(s):s).toLocaleDateString("fr-CA", opt);
const fmtT = ts => new Date(ts).toLocaleTimeString("fr-CA",{hour:"2-digit",minute:"2-digit"});
const fmtDur = ms => { const m = Math.round(ms/60000); return m < 60 ? `${m} min` : `${Math.floor(m/60)} h ${pad(m%60)}`; };
const fmtMin = m => m < 60 ? `${Math.round(m)} min` : `${Math.floor(m/60)} h${m%60?" "+pad(Math.round(m%60)):""}`;
const localInput = ts => { const d = new Date(ts); d.setMinutes(d.getMinutes()-d.getTimezoneOffset()); return d.toISOString().slice(0,16); };
const fmtNum = (v, dp=1) => Number(v).toLocaleString("fr-CA",{minimumFractionDigits:dp,maximumFractionDigits:dp});
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));

/* ---------- âge ---------- */
const ageMonths = (dob, at = today()) => (at - parseD(dob)) / DAY / MONTH_DAYS;
// Âge corrigé : si AG < 37 SA, on retire (40 SA − AG) ; appliqué jusqu'à 24 mois d'âge chronologique.
function correction(c){ const g = (Number(c.gaW)||40)*7 + (Number(c.gaD)||0); return g >= 259 ? 0 : (280 - g)/MONTH_DAYS; }
const usesCorrected = (c, at = today()) => correction(c) > 0 && ageMonths(c.dob, at) < 24;
const effAge = (c, at = today(), chrono=false) => { const a = ageMonths(c.dob, at); return (!chrono && usesCorrected(c, at)) ? Math.max(0, a - correction(c)) : a; };
function ageLabel(m){
  if (m < 0) return "pas encore né";
  const days = Math.round(m * MONTH_DAYS);
  if (days < 14) return `${days} jour${days>1?"s":""}`;
  if (m < 3) { const w = Math.floor(days/7); return `${w} semaine${w>1?"s":""}`; }
  if (m < 24) { const mm = Math.floor(m), w = Math.floor((m-mm)*MONTH_DAYS/7); return `${mm} mois${w?` ${w} sem.`:""}`; }
  const y = Math.floor(m/12), r = Math.floor(m - y*12);
  return `${y} an${y>1?"s":""}${r && y<6 ? ` ${r} mois` : ""}`;
}
const mLabel = m => m < 24 ? `${Math.round(m)} mois` : (m % 12 === 0 ? `${m/12} ans` : `${fmtNum(m/12, 1)} ans`);
const STAGES = [
  {max:12, id:"nour", label:"Nourrisson", color:"peach"},
  {max:36, id:"bamb", label:"Bambin", color:"butter"},
  {max:72, id:"pres", label:"Préscolaire", color:"mint"},
  {max:144, id:"scol", label:"Âge scolaire", color:"sky"},

];
const stageOf = m => STAGES.find(s => m < s.max);
const lookOf = c => (c.look && c.look !== "auto") ? STAGES.find(s => s.id === c.look) : stageOf(ageMonths(c.dob));

/* ---------- moteur OMS (LMS) ---------- */
const MEAS = {
  weight:{label:"Poids", unit:"kg", dp:2},
  height:{label:"Taille", unit:"cm", dp:1},
  ofc:{label:"Périmètre crânien", unit:"cm", dp:1},
  bmi:{label:"IMC", unit:"kg/m²", dp:1},
};
function lmsAt(meas, sex, m){
  const t = LMS[meas]?.[sex]; if (!t) return null;
  if (m < 0 || m > t[t.length-1][0]) return null;
  const i = Math.min(Math.floor(m), t.length-2), f = m - t[i][0], a = t[i], b = t[i+1];
  return { L: a[1] + (b[1]-a[1])*f, M: a[2] + (b[2]-a[2])*f, S: a[3] + (b[3]-a[3])*f };

const xAtZ = ({L,M,S}, z) => Math.abs(L) < 1e-7 ? M*Math.exp(S*z) : M*Math.pow(1 + L*S*z, 1/L);
// z = ((X/M)^L − 1)/(L·S) ; correction OMS au-delà de ±3 DS pour poids et IMC
function zScore(meas, sex, m, x){
  const p = lmsAt(meas, sex, m); if (!p || !(x > 0)) return null;
  const {L,M,S} = p;
  let z = Math.abs(L) < 1e-7 ? Math.log(x/M)/S : (Math.pow(x/M, L) - 1)/(L*S);
  if (meas === "weight" || meas === "bmi"){
    if (z > 3){ const s3 = xAtZ(p,3), s2 = xAtZ(p,2); z = 3 + (x - s3)/(s3 - s2); }
    else if (z < -3){ const s3 = xAtZ(p,-3), s2 = xAtZ(p,-2); z = -3 - (s3 - x)/(s2 - s3); }

}
function growthAlerts(c){
  const out = [];
  for (const meas of ["weight","height","ofc","bmi"]){
    const pts = growthPoints(c, meas).filter(p => p.z != null);
    if (pts.length < 2) continue;
    const last = pts[pts.length-1];
    let worst = null;
    for (const p of pts.filter(p => last.m - p.m <= 12 && p !== last)){ const n = linesCrossed(p.z, last.z); if (n >= 2 && (!worst || n > worst.n)) worst = {n, from:p}; }
    if (worst) out.push({meas, n:worst.n, dir: last.z < worst.from.z ? "baisse" : "hausse", from:worst.from, last});

// Taille cible parentale (Tanner) : (père + mère ± 13)/2, ±8,5 cm
function midParental(c){
  const f = Number(c.hFather), m = Number(c.hMother); if (!f || !m) return null;
  const t = c.sex === "M" ? (f + m + 13)/2 : (f + m - 13)/2;
  const ref = lmsAt("height", c.sex, 228);
  return { t, lo: t - 8.5, hi: t + 8.5, z: zScore("height", c.sex, 228, t), ref };
}
/* Projection de taille adulte (estimation statistique simple) :
   1) on suppose que l'enfant garde son z-score actuel jusqu'à 19 ans ;
   2) incertitude : écart-type résiduel √(1−r²), r = corrélation entre le z actuel et le z adulte,
      qui augmente avec l'âge (≈0,6 avant 2 ans → ≈0,85 après 10 ans) ; intervalle à 80 % = ±1,28 DS ;
   3) si la taille parentale est connue, estimation combinée = moyenne des deux z. */
function heightProjection(c){
  const pts = growthPoints(c, "height").filter(p => p.z != null);
  if (!pts.length) return null;
  const last = pts[pts.length-1];
  const r = last.m < 24 ? 0.6 : last.m < 48 ? 0.7 : last.m < 120 ? 0.8 : 0.85;
  const sdRes = Math.sqrt(1 - r*r), half = 1.28*sdRes;
  const adult = lmsAt("height", c.sex, 228);
  const mp = midParental(c);
  const zComb = mp ? (last.z + mp.z)/2 : null;
  const curve = [];
  for (let m = Math.ceil(last.m); m <= 228; m += 1){
    const p = lmsAt("height", c.sex, m); if (!p) continue;
    const w = half * (m - last.m) / Math.max(1, 228 - last.m);
    curve.push({m, x:xAtZ(p, last.z), lo:xAtZ(p, last.z - w), hi:xAtZ(p, last.z + w), comb: zComb!=null ? xAtZ(p, last.z + (zComb-last.z)*(m-last.m)/Math.max(1,228-last.m)) : null});
  }
  return { last, r, adult:xAtZ(adult, last.z), lo:xAtZ(adult, last.z-half), hi:xAtZ(adult, last.z+half), comb: zComb!=null ? xAtZ(adult, zComb) : null, mp, curve };
}

function heightVelocity(c){
  const pts = growthPoints(c, "height", true); if (pts.length < 2) return null;
  const last = pts[pts.length-1];
  const prev = [...pts].reverse().find(p => last.m - p.m >= 4); if (!prev) return null;
  return { v: (last.x - prev.x) / ((last.m - prev.m)/12), from:prev, to:last };
}

function vaxStatus(c, g){
  const due = addMonths(parseD(c.dob), g.age), lateAfter = addMonths(due, g.window || (g.age === 0 ? 3 : 1)), t = today();

    const rec = c.vaccines[d.id]; let st;
    if (rec) st = "fait";
    else if (d.seasonal && ageMonths(c.dob) > 8) st = "na";
    else if (t > lateAfter) st = "retard";

    else st = "avenir";
    return { ...d, due, st, rec };
  });
}
function nextVaccines(c){

  if (st === "nour"){
    s += cloud(80,120,1.4,"var(--sky-bg)") + cloud(900,80,1.8,"var(--lilac-bg)") + cloud(1020,620,1.3,"var(--peach-bg)") + cloud(180,700,1.6,"var(--mint-bg)");
    [[300,90,12],[640,60,9],[1100,300,14],[60,420,10],[520,820,12],[860,420,8],[1150,820,10],[400,500,7]].forEach(([x,y,r],i)=> s += star(x,y,r, i%2?"var(--butter)":"var(--lilac)"));
    s += `<path d="M1120 140a46 46 0 1 1-36-70 36 36 0 0 0 36 70z" fill="var(--butter)"/>`;
  } else if (st === "bamb"){
    const cols = ["var(--peach)","var(--butter)","var(--mint)","var(--sky)","var(--lilac)","var(--rose)"];
    [[90,140,40],[1080,110,56],[260,760,48],[980,720,40],[620,60,26],[40,520,30],[1160,460,34],[520,860,30]].forEach(([x,y,r],i)=>{
      const f = cols[i%6];
      s += i%3===0 ? `<circle cx="${x}" cy="${y}" r="${r}" fill="${f}" opacity=".35"/>` : i%3===1 ? `<rect x="${x-r}" y="${y-r}" width="${r*2}" height="${r*2}" rx="${r*.35}" fill="${f}" opacity=".35" transform="rotate(${i*13} ${x} ${y})"/>` : `<path d="M${x} ${y-r}L${x+r} ${y+r*.8}H${x-r}Z" fill="${f}" opacity=".35" stroke-linejoin="round"/>`;
    });
  } else if (st === "pres"){
    s += `<g fill="none" stroke-width="22" stroke-linecap="round" opacity=".35"><path d="M-40 900a280 280 0 0 1 560 0" stroke="var(--rose)"/><path d="M0 900a240 240 0 0 1 480 0" stroke="var(--butter)"/><path d="M40 900a200 200 0 0 1 400 0" stroke="var(--mint)"/><path d="M80 900a160 160 0 0 1 320 0" stroke="var(--sky)"/></g>`;
    s += `<circle cx="1080" cy="130" r="60" fill="var(--butter)" opacity=".5"/>`;
    for (let i=0;i<10;i++){ const a = i*Math.PI/5; s += `<line x1="${1080+Math.cos(a)*80}" y1="${130+Math.sin(a)*80}" x2="${1080+Math.cos(a)*104}" y2="${130+Math.sin(a)*104}" stroke="var(--butter)" stroke-width="8" stroke-linecap="round" opacity=".5"/>`; }
    s += `<path d="M700 60c40-30 80 30 120 0s80 30 120 0" stroke="var(--lilac)" stroke-width="8" fill="none" stroke-linecap="round" opacity=".4"/><path d="M900 780c40-30 80 30 120 0s80 30 120 0" stroke="var(--peach)" stroke-width="8" fill="none" stroke-linecap="round" opacity=".4"/>`;
  } else if (st === "scol"){
    s += `<defs><pattern id="nb" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M0 39.5H40" stroke="var(--sky)" stroke-width="1" opacity=".35"/></pattern></defs><rect width="${W}" height="${H}" fill="url(#nb)"/><line x1="90" y1="0" x2="90" y2="${H}" stroke="var(--rose)" stroke-width="2" opacity=".35"/>`;
    [[1040,140,22],[1140,520,16],[260,820,18]].forEach(([x,y,r],i)=> s += star(x,y,r, ["var(--butter)","var(--mint)","var(--lilac)"][i]));
    s += `<g transform="translate(960 700) rotate(-30)" opacity=".5"><rect width="200" height="26" rx="5" fill="var(--butter)"/><path d="M200 0l34 13-34 13z" fill="var(--peach)"/><rect x="-24" width="24" height="26" rx="5" fill="var(--rose)"/></g>`;
  } else {
    s += `<defs><filter id="bl"><feGaussianBlur stdDeviation="70"/></filter></defs><g filter="url(#bl)" opacity=".55"><circle cx="1050" cy="120" r="230" fill="var(--lilac)"/><circle cx="120" cy="780" r="220" fill="var(--sky)"/><circle cx="700" cy="900" r="160" fill="var(--rose)"/></g>`;
    s += `<g stroke="var(--soft)" stroke-width="1" opacity=".3">${Array.from({length:14},(_,i)=>`<line x1="${i*90}" y1="0" x2="${i*90-300}" y2="${H}"/>`).join("")}</g>`;
  }
  return s + `</svg>`;
}

function applyLook(){

function devPreview(c){
  const em = effAge(c);
  const band = BANDS.find(b => b >= em) || 72;
  const items = MS.filter(it => bandOf(it) === band);
  const done = items.filter(it => c.milestones[it.k]).length;
  const late = MS.filter(it => it.al && em > it.al && !c.milestones[it.k]);
  return `<div class="card-h"><div><span class="eyebrow">Jalons à observer</span><h2>D'ici ${bandLabel(band)}</h2></div><span class="chip mint num">${done}/${items.length}</span></div>
    ${late.length?`<div class="banner warn">${icon("info")}<div>${late.length} jalon${late.length>1?"s":""} habituellement acquis à cet âge ne ${late.length>1?"sont":"est"} pas coché${late.length>1?"s":""}. <button class="btn sm ghost" data-act="go" data-v="sante" data-s="dev">Voir</button></div></div>`:""}
    <div>${items.slice(0,6).map(it => msRow(c,it)).join("")}</div>
    <button class="btn sm ghost" data-act="go" data-v="sante" data-s="dev" style="align-self:flex-start">Vue détaillée avec les plages d'âge</button>`;
}
function msRow(c, it, showRange=true){
  const on = !!c.milestones[it.k];
  return `<div class="ms"><button class="check" role="checkbox" aria-checked="${on}" aria-label="${esc(it.t)}" data-act="ms" data-v="${esc(it.k)}">${on?icon("check"):""}</button><div style="flex:1;min-width:0"><div class="dom" style="color:var(--${DOMAINS[it.d].color}-ink)">${DOMAINS[it.d].label}</div><div>${esc(it.t)}</div><div class="tiny muted">${showRange?`Habituellement ${rangeTxt(it)}`:""}${on?` · observé le ${fmtD(c.milestones[it.k])}`:""}</div></div></div>`;
}
const rangeTxt = it => it.b < 24 ? `entre ${fmtNum(it.a, it.a%1?1:0)} et ${fmtNum(it.b, it.b%1?1:0)} mois` : `entre ${mLabel(it.a)} et ${mLabel(it.b)}`.replace(/(\d+) mois et (\d+) ans/,"$1 mois et $2 ans");
function feverAlert(c){
  const r = c.logs.filter(l => l.type === "temp" && Date.now() - l.t < 24*36e5).sort((a,b)=>b.t-a.t)[0];
  if (!r) return "";
  const v = Number(r.data.temp), site = r.data.site;
  const thr = site === "Buccale" ? 37.5 : site === "Axillaire" ? 37.3 : 38.0;
  if (!(v > thr)) return "";
  if (ageMonths(c.dob) < 3) return `<div class="banner alert">${icon("alert")}<div><b>Fièvre chez un bébé de moins de 3 mois (${fmtNum(v)} °C, ${site.toLowerCase()}).</b> Consultez rapidement à l'urgence, ou appelez le 811 pour être orienté.</div></div>`;
  return `<div class="banner warn">${icon("thermo")}<div><b>Fièvre notée (${fmtNum(v)} °C, ${site.toLowerCase()}).</b> Consultez si l'enfant est très somnolent, respire difficilement, a des taches sur la peau, ou si la fièvre dure plus de 72 h. Info-Santé : 811.</div></div>`;
}

/* ======== QUOTIDIEN (journal + bien-être) ======== */
const LOGT = {
  feed:{label:"Boire", ic:"bottle", c:"peach", mod:"feeding"}, solid:{label:"Manger", ic:"spoon", c:"mint", mod:"solids"},
  sleep:{label:"Dodo", ic:"moon", c:"lilac"}, diaper:{label:"Couche", ic:"drop", c:"sky", mod:"diapers"},
  tummy:{label:"Sur le ventre", ic:"tummy", c:"butter", mod:"tummy"}, activity:{label:"Activité", ic:"run", c:"mint"},
  read:{label:"Lecture", ic:"book", c:"peach", mod:"reading"}, screen:{label:"Écran", ic:"screen", c:"sky", mod:"screen"},
  mood:{label:"Humeur", ic:"smile", c:"butter", mod:"mood"}, temp:{label:"Température", ic:"thermo", c:"rose"},
  med:{label:"Médicament", ic:"pill", c:"butter"}, note:{label:"Note", ic:"note", c:"lilac"},
};
const typesFor = c => Object.keys(LOGT).filter(t => !LOGT[t].mod || mod(c, LOGT[t].mod)).filter(t => !(t === "activity" && ageMonths(c.dob) < 9 && mod(c,"tummy")));
const quickButtons = c => `<div class="quick">${typesFor(c).map(t => `<button class="qbtn" style="background:var(--${LOGT[t].c}-bg);color:var(--${LOGT[t].c}-ink)" data-act="log" data-v="${t}">${icon(LOGT[t].ic)}${LOGT[t].label}</button>`).join("")}</div>`;
// Totaux d'une journée (le sommeil est compté le jour où il se termine)
function dayTotals(c, d){
  const s = d.getTime(), e = s + DAY, T = {sleep:0, act:0, screen:0, read:0, feeds:0, ml:0, diapers:0};
  c.logs.forEach(l => {
    const mins = Number(l.data?.min)||0;
    if (l.type === "sleep" && l.end && l.end >= s && l.end < e) T.sleep += (l.end - l.t)/6e4;
    if (l.t < s || l.t >= e) return;
    if (l.type === "activity" || l.type === "tummy") T.act += mins;
    if (l.type === "screen") T.screen += mins;
    if (l.type === "read") T.read += mins;
    if (l.type === "feed"){ T.feeds++; T.ml += Number(l.data.ml)||0; }
    if (l.type === "diaper") T.diapers++;
  });
  return T;
}
function ring(pct, col, over=false){
  const r = 21, C = 2*Math.PI*r, p = clamp(pct,0,1);
  return `<svg viewBox="0 0 52 52"><circle cx="26" cy="26" r="${r}" fill="none" stroke="var(--line)" stroke-width="6"/><circle cx="26" cy="26" r="${r}" fill="none" stroke="${over?"var(--danger)":`var(--${col})`}" stroke-width="6" stroke-linecap="round" stroke-dasharray="${(C*p).toFixed(1)} ${C.toFixed(1)}" transform="rotate(-90 26 26)"/></svg>`;
}
function ringsCard(c){
  const m = ageMonths(c.dob), g = guide(m), T = dayTotals(c, today());
  const y = dayTotals(c, addDays(today(), -1));
  const sleepH = Math.max(T.sleep, 0)/60;
  const cells = [];
  if (mod(c,"feeding")) { const lastF = c.logs.filter(l=>l.type==="feed").sort((a,b)=>b.t-a.t)[0];
    cells.push(`<div class="ring">${ring(T.feeds/8,"peach")}<div><div class="tiny muted">Boires</div><div class="v num">${T.feeds}${T.ml?` · ${T.ml} ml`:""}</div><div class="tiny muted">${lastF?`dernier il y a ${fmtDur(Date.now()-lastF.t)}`:"aucun"}</div></div></div>`); }
  cells.push(`<div class="ring">${ring(sleepH/g.sleep[0],"lilac")}<div><div class="tiny muted">Sommeil</div><div class="v num">${sleepH?fmtMin(T.sleep):"—"}</div><div class="tiny muted">cible ${g.sleep[0]}-${g.sleep[1]} h</div></div></div>`);
  cells.push(`<div class="ring">${ring(T.act/g.act,"mint")}<div><div class="tiny muted">${m<12?"Ventre / sol":"Activité"}</div><div class="v num">${fmtMin(T.act)}</div><div class="tiny muted">cible ${fmtMin(g.act)}</div></div></div>`);
  if (mod(c,"screen")) cells.push(`<div class="ring">${ring(g.screen?T.screen/g.screen:(T.screen?1:0),"sky",T.screen>g.screen)}<div><div class="tiny muted">Écran</div><div class="v num">${fmtMin(T.screen)}</div><div class="tiny muted">${g.screen?`max ${fmtMin(g.screen)}`:"aucun avant 2 ans"}</div></div></div>`);
  if (mod(c,"reading")) cells.push(`<div class="ring">${ring(T.read/g.read,"peach")}<div><div class="tiny muted">Lecture</div><div class="v num">${fmtMin(T.read)}</div><div class="tiny muted">objectif ${g.read} min</div></div></div>`);
  if (mod(c,"diapers")) cells.push(`<div class="ring">${ring(T.diapers/6,"sky")}<div><div class="tiny muted">Couches</div><div class="v num">${T.diapers}</div><div class="tiny muted">hier : ${y.diapers}</div></div></div>`);
  return `<div class="rings">${cells.join("")}</div>`;
}
function weekBars(c, key, target, col, isMax=false, unitH=false){
  const days = Array.from({length:7}, (_,i) => addDays(today(), i-6));
  const vals = days.map(d => dayTotals(c, d)[key] / (unitH?60:1));
  const max = Math.max(target*1.25, ...vals, 1);
  const avg = vals.reduce((a,b)=>a+b,0)/7;
  return `<div style="position:relative"><div class="weekbars">${days.map((d,i) => { const v = vals[i]; const bad = isMax ? v > target : v < target*0.8;
    return `<div class="wb" title="${fmtD(d,{weekday:"long"})} : ${unitH?fmtNum(v,1)+" h":Math.round(v)+" min"}"><i style="height:${(v/max*72).toFixed(1)}px;background:var(--${bad&&isMax?"danger":col})${bad&&!isMax?";opacity:.5":""}"></i><span>${d.toLocaleDateString("fr-CA",{weekday:"narrow"})}</span></div>`; }).join("")}</div>
    <div style="position:absolute;left:0;right:0;bottom:${(18 + target/max*72).toFixed(1)}px;border-top:2px dashed var(--soft)" aria-hidden="true"></div></div>
    <div class="tiny muted">Moyenne 7 jours : <b class="num">${unitH?fmtNum(avg,1)+" h":fmtMin(avg)}</b> · ${isMax?"maximum":"cible"} ${unitH?target+" h":fmtMin(target)}</div>`;
}
function quotidien(c){

  h += `<div class="card"><div class="card-h"><div><span class="eyebrow">Mouvement sur 24 h</span><h2>Bien-être d'aujourd'hui</h2></div></div>${ringsCard(c)}
    <p class="tiny muted">Cibles des Directives canadiennes en matière de mouvement sur 24 heures pour cet âge : sommeil ${g.sleep[0]} à ${g.sleep[1]} h${m<12?" (siestes comprises)":""}, ${g.actLbl.toLowerCase()} ${fmtMin(g.act)}, écran ${g.screen?`au plus ${fmtMin(g.screen)}`:"aucun"}. Lecture : objectif suggéré.</p></div>`;
  h += `<div class="grid"><div class="card c6"><h3>Sommeil, 7 jours</h3>${weekBars(c,"sleep",g.sleep[0],"lilac",false,true)}</div>
    <div class="card c6"><h3>${m<12?"Temps sur le ventre":"Activité physique"}, 7 jours</h3>${weekBars(c,"act",g.act,"mint")}</div>
    ${mod(c,"screen")?`<div class="card c6"><h3>Écran, 7 jours</h3>${weekBars(c,"screen",Math.max(g.screen,1),"sky",true)}</div>`:""}

}
function dayLogs(c, d){ const s = d.getTime(), e = s + DAY; return c.logs.filter(l => l.t >= s && l.t < e).sort((a,b)=>b.t-a.t); }
const dayName = d => { const diff = Math.round((today()-d)/DAY); return diff===0?"Aujourd'hui":diff===1?"Hier":fmtD(d,{weekday:"long",day:"numeric",month:"long"}); };

const WD = ["dim.","lun.","mar.","mer.","jeu.","ven.","sam."];

function logLine(l){
  const T = LOGT[l.type] || LOGT.note, d = l.data || {};
  let txt = T.label, sub = "";
  if (l.type === "feed") { txt = d.mode || "Boire"; sub = [d.ml?`${d.ml} ml`:"", l.end?fmtDur(l.end-l.t):""].filter(Boolean).join(" · "); }
  if (l.type === "sleep") sub = l.end ? `${fmtT(l.t)} → ${fmtT(l.end)} · ${fmtDur(l.end-l.t)}` : "en cours";
  if (l.type === "diaper") txt = `Couche · ${d.kind}`;
  if (l.type === "solid") { txt = d.food || "Repas"; sub = d.allergen ? `Allergène : ${d.allergen}${d.reaction?` · réaction : ${d.reaction}`:""}` : ""; }
  if (l.type === "temp") { txt = `${fmtNum(d.temp)} °C`; sub = d.site; }
  if (l.type === "med") { txt = d.name || "Médicament"; sub = d.dose || ""; }
  if (l.type === "mood") txt = `Humeur · ${d.mood}`;
  if (l.type === "screen") txt = `Écran · ${fmtMin(d.min)}`;
  if (l.type === "tummy") txt = `Sur le ventre · ${fmtMin(d.min)}`;
  if (l.type === "read") { txt = `Lecture · ${fmtMin(d.min)}`; sub = d.title || ""; }
  if (l.type === "activity") { txt = `${d.what || "Activité"} · ${fmtMin(d.min)}`; sub = d.intensity || ""; }
  if (l.type === "note") txt = d.text;
  if (d.note && l.type!=="note") sub = [sub, d.note].filter(Boolean).join(" · ");
  return `<div class="li"><div class="ic" style="background:var(--${T.c}-bg);color:var(--${T.c}-ink)">${icon(T.ic)}</div><div class="grow"><div class="li-title">${esc(txt)}</div>${sub?`<div class="small muted">${esc(sub)}</div>`:""}</div><span class="small muted num">${fmtT(l.t)}</span><button class="icon-btn flat" data-act="delLog" data-v="${l.id}" aria-label="Supprimer">${icon("trash")}</button></div>`;
}

/* ======== CROISSANCE ======== */
function courbes(c){

    <div class="row between"><div class="seg" role="group" aria-label="Mesure">${avail.map(x=>`<button data-act="meas" data-v="${x}" aria-pressed="${x===k}">${MEAS[x].label}</button>`).join("")}</div>
    ${correction(c)>0?`<div class="seg"><button data-act="chrono" data-v="0" aria-pressed="${!UI.chrono}">Âge corrigé</button><button data-act="chrono" data-v="1" aria-pressed="${UI.chrono}">Chronologique</button></div>`:""}</div>

    <div class="chart-wrap" id="chart"></div>
    <div class="legend"><span><i style="background:var(--soft)"></i>3e et 97e</span><span><i style="background:var(--soft);opacity:.6"></i>15e et 85e</span><span><i style="background:var(--muted)"></i>50e</span><span><i style="background:var(--kid);height:8px;width:8px;border-radius:50%"></i>${esc(c.name)}</span></div>
    ${alerts.map(a => a.out
      ? `<div class="banner warn">${icon("info")}<div>La dernière mesure est ${a.last.z<0?"sous le 3e":"au-dessus du 97e"} percentile. Ce n'est pas forcément anormal ; montrez la courbe au médecin.</div></div>`
      : `<div class="banner warn">${icon("info")}<div><b>Changement de couloir.</b> Depuis le ${fmtD(a.from.date)}, la courbe a franchi ${a.n} lignes de percentiles à la ${a.dir}. À montrer au médecin à la prochaine visite.</div></div>`).join("")}
    ${usesCorrected(c)&&!UI.chrono?`<p class="small muted">Âge corrigé utilisé jusqu'à 24 mois (né·e à ${c.gaW} SA ${c.gaD||0} j).</p>`:""}
  </div>`;
  if (k === "height" || k === "weight"){
    h += `<div class="grid">`;
    if (vel && k === "height"){ const slow = m > 36 && m < 120 && vel.v < 4;
      h += `<div class="card c6"><span class="eyebrow">Vitesse de croissance</span><div class="stat"><div class="v num">${fmtNum(vel.v,1)}<small>cm / an</small></div><span class="small muted">du ${fmtD(vel.from.date)} au ${fmtD(vel.to.date)}</span></div>
      ${slow?`<div class="banner warn">${icon("info")}<div>Moins de 4 cm par an entre 3 ans et la puberté : à vérifier avec le médecin.</div></div>`:`<p class="small muted">Repère : environ 25 cm la 1re année, 12 cm la 2e, puis 5 à 7 cm par an jusqu'à la puberté.</p>`}</div>`; }
    if (mp) h += `<div class="card c6"><span class="eyebrow">Taille cible parentale</span><div class="stat"><div class="v num">${fmtNum(mp.t,0)}<small>cm</small></div><span class="small muted">Intervalle habituel ${fmtNum(mp.lo,0)} à ${fmtNum(mp.hi,0)} cm · ${pctLabel(mp.z)}e percentile adulte</span></div></div>`;
    h += `</div>`;
  }
  if (mod(c,"projection")) h += `<div class="card"><div class="card-h"><div><span class="eyebrow">Modèle prédictif</span><h2>Projection de la taille adulte</h2></div></div><div id="proj"></div></div>`;
  h += `<div class="card"><div class="card-h"><h2>Historique</h2></div>`;
  if (!c.growth.length) h += `<div class="empty">${icon("chart")}<p>Ajoutez une première mesure.</p></div>`;
  else h += `<div class="tbl"><table><thead><tr><th>Date</th><th>Âge</th><th>Poids</th><th>Taille</th>${mod(c,"ofc")?"<th>PC</th>":""}<th>IMC</th><th></th></tr></thead><tbody>${[...c.growth].sort((a,b)=>a.date<b.date?1:-1).map(g => {
    const am = effAge(c, parseD(g.date));
    const cell = (key, val, dp) => { if (!val) return `<td class="muted">—</td>`; const z = zScore(key, c.sex, am, val); return `<td><b>${fmtNum(val,dp)}</b>${z!=null?`<div class="tiny muted">P${pctLabel(z)} · z ${z>=0?"+":""}${fmtNum(z,2)}</div>`:""}</td>`; };

  return h + `<p class="tiny muted">Normes OMS de croissance (0-5 ans) et référence OMS 2007 (5-19 ans), recommandées au Canada. Taille couchée avant 2 ans.</p></div>`;

function ranges(k){
  const r = [{id:"0-2", a:0, b:24, l:"0-2 ans"}, {id:"2-5", a:24, b:60, l:"2-5 ans"}];
  if (k === "weight") r.push({id:"5-10", a:60, b:120, l:"5-10 ans"});
  if (k === "height" || k === "bmi") r.push({id:"5-19", a:60, b:228, l:"5-19 ans"});
  return r;
}
const niceStep = v => { const e = Math.pow(10, Math.floor(Math.log10(v))); const f = v/e; return (f<1.5?1:f<3.5?2:f<7.5?5:10)*e; };
function chartFrame(W, H, P, R, lo, hi){
  const X = m => P.l + (m-R.a)/(R.b-R.a)*(W-P.l-P.r), Y = v => H-P.b - (v-lo)/(hi-lo)*(H-P.t-P.b);
  return {X, Y};
}
function drawChart(c){
  const k = UI.sub.courbes, rs = ranges(k), am = effAge(c, today(), UI.chrono);
  const R = rs.find(r => r.id === UI.range) || rs.find(r => am < r.b) || rs[rs.length-1];
  $("#rangeSeg").innerHTML = rs.map(r => `<button data-act="range" data-v="${r.id}" aria-pressed="${r.id===R.id}">${r.l}</button>`).join("");
  const pts = growthPoints(c, k, UI.chrono).filter(p => p.m >= R.a - 0.01 && p.m <= R.b + 0.01);
  const W = 720, H = 380, P = {l:46, r:44, t:18, b:34}, step = (R.b - R.a) <= 24 ? 0.5 : 1;
  const curves = PCT_LINES.map(L => { const arr=[]; for (let m=R.a; m<=R.b+1e-9; m+=step){ const p = lmsAt(k, c.sex, m); if (p) arr.push([m, xAtZ(p, L.z)]); } return {...L, arr}; });
  let lo = Infinity, hi = -Infinity;
  curves.forEach(cv => cv.arr.forEach(([,y]) => { lo = Math.min(lo,y); hi = Math.max(hi,y); }));
  pts.forEach(p => { lo = Math.min(lo,p.x); hi = Math.max(hi,p.x); });
  const ys = niceStep((hi-lo)*1.12/6); lo = Math.max(0, Math.floor((lo-(hi-lo)*.06)/ys)*ys); hi = Math.ceil((hi+(hi-lo)*.06)/ys)*ys;
  const {X, Y} = chartFrame(W, H, P, R, lo, hi);
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Courbe ${MEAS[k].label} de ${esc(c.name)}" style="font-family:var(--body)">`;
  for (let v=lo; v<=hi+1e-9; v+=ys) s += `<line x1="${P.l}" x2="${W-P.r}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)"/><text x="${P.l-8}" y="${Y(v)+4}" text-anchor="end" font-size="11" fill="var(--muted)">${fmtNum(v, ys<1?1:0)}</text>`;
  const xs = (R.b-R.a) <= 24 ? 3 : (R.b-R.a) <= 36 ? 6 : 12;
  for (let m=R.a; m<=R.b; m+=xs) s += `<line x1="${X(m)}" x2="${X(m)}" y1="${P.t}" y2="${H-P.b}" stroke="var(--line)" stroke-dasharray="2 4"/><text x="${X(m)}" y="${H-P.b+18}" text-anchor="middle" font-size="11" fill="var(--muted)">${R.b<=24?m+" m":(m/12)+" a"}</text>`;
  const c15 = curves[1].arr, c85 = curves[3].arr;
  s += `<path d="M${c15.map(([m,v])=>`${X(m)},${Y(v)}`).join("L")}L${c85.slice().reverse().map(([m,v])=>`${X(m)},${Y(v)}`).join("L")}Z" fill="var(--kid-bg)"/>`;
  curves.forEach(cv => { const main = cv.p === 50, outer = cv.p === 3 || cv.p === 97;
    s += `<path d="M${cv.arr.map(([m,v])=>`${X(m).toFixed(1)},${Y(v).toFixed(1)}`).join("L")}" fill="none" stroke="${main?"var(--muted)":"var(--soft)"}" stroke-width="${main?2:outer?1.5:1.2}" ${outer||main?"":'stroke-dasharray="5 4"'}/>`;
    const last = cv.arr[cv.arr.length-1]; s += `<text x="${W-P.r+6}" y="${Y(last[1])+4}" font-size="11" fill="var(--muted)" font-weight="${main?700:500}">${cv.p}e</text>`; });
  if (pts.length){

function drawProjection(c){
  const el = $("#proj"); if (!el) return;
  const pj = heightProjection(c);
  if (!pj){ el.innerHTML = `<p class="small muted">Ajoutez au moins une mesure de taille pour voir la projection.</p>`; return; }
  const W = 720, H = 360, P = {l:46, r:64, t:18, b:34}, R = {a:0, b:228};
  const ref = [-1.8808, 0, 1.8808].map(z => { const arr=[]; for (let m=0; m<=228; m+=2){ const p = lmsAt("height", c.sex, m); if (p) arr.push([m, xAtZ(p, z)]); } return arr; });
  const lo = 40, hi = Math.ceil(Math.max(ref[2][ref[2].length-1][1], pj.hi, pj.mp?pj.mp.hi:0)/10)*10 + 5;
  const {X, Y} = chartFrame(W, H, P, R, lo, hi);
  const pts = growthPoints(c, "height");
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Projection de taille adulte" style="font-family:var(--body)">`;
  for (let v=50; v<=hi; v+=20) s += `<line x1="${P.l}" x2="${W-P.r}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)"/><text x="${P.l-8}" y="${Y(v)+4}" text-anchor="end" font-size="11" fill="var(--muted)">${v}</text>`;
  for (let m=0; m<=228; m+=24) s += `<text x="${X(m)}" y="${H-P.b+18}" text-anchor="middle" font-size="11" fill="var(--muted)">${m/12} a</text>`;
  ref.forEach((arr,i) => s += `<path d="M${arr.map(([m,v])=>`${X(m).toFixed(1)},${Y(v).toFixed(1)}`).join("L")}" fill="none" stroke="${i===1?"var(--muted)":"var(--soft)"}" stroke-width="${i===1?1.6:1.2}"/>`);
  // bande d'incertitude
  s += `<path d="M${pj.curve.map(p=>`${X(p.m).toFixed(1)},${Y(p.lo).toFixed(1)}`).join("L")}L${pj.curve.slice().reverse().map(p=>`${X(p.m).toFixed(1)},${Y(p.hi).toFixed(1)}`).join("L")}Z" fill="var(--kid)" opacity=".22"/>`;
  s += `<path d="M${X(pj.last.m)},${Y(pj.last.x)}L${pj.curve.map(p=>`${X(p.m).toFixed(1)},${Y(p.x).toFixed(1)}`).join("L")}" fill="none" stroke="var(--kid-ink)" stroke-width="2" stroke-dasharray="6 5"/>`;
  if (pj.comb != null) s += `<path d="M${X(pj.last.m)},${Y(pj.last.x)}L${pj.curve.map(p=>`${X(p.m).toFixed(1)},${Y(p.comb).toFixed(1)}`).join("L")}" fill="none" stroke="var(--lilac-ink)" stroke-width="2" stroke-dasharray="2 4"/>`;
  if (pj.mp) s += `<rect x="${W-P.r+8}" y="${Y(pj.mp.hi)}" width="10" height="${Y(pj.mp.lo)-Y(pj.mp.hi)}" rx="5" fill="var(--lilac)" opacity=".7"/><circle cx="${W-P.r+13}" cy="${Y(pj.mp.t)}" r="5" fill="var(--lilac-ink)"/><text x="${W-P.r+24}" y="${Y(pj.mp.t)+4}" font-size="11" fill="var(--lilac-ink)" font-weight="700">cible</text>`;
  s += `<path d="M${pts.map(p=>`${X(p.m).toFixed(1)},${Y(p.x).toFixed(1)}`).join("L")}" fill="none" stroke="var(--kid-ink)" stroke-width="2.5"/>`;
  pts.forEach(p => s += `<circle cx="${X(p.m)}" cy="${Y(p.x)}" r="4.5" fill="var(--kid)" stroke="var(--surface)" stroke-width="2"/>`);
  s += `<circle cx="${X(228)}" cy="${Y(pj.adult)}" r="6" fill="var(--kid-ink)"/><text x="${X(228)-8}" y="${Y(pj.adult)-10}" text-anchor="end" font-size="12" font-weight="700" fill="var(--kid-ink)">${fmtNum(pj.adult,0)} cm</text></svg>`;
  const young = pj.last.m < 24;
  el.innerHTML = `<div class="stats"><div class="stat"><span class="muted tiny">Si ${esc(c.name)} garde son couloir (P${pctLabel(pj.last.z)})</span><div class="v num">${fmtNum(pj.adult,0)}<small>cm</small></div><span class="small muted">80 % de chances entre ${fmtNum(pj.lo,0)} et ${fmtNum(pj.hi,0)} cm</span></div>
    ${pj.mp?`<div class="stat"><span class="muted tiny">Taille cible parentale</span><div class="v num">${fmtNum(pj.mp.t,0)}<small>cm</small></div><span class="small muted">± 8,5 cm</span></div>`:`<div class="stat"><span class="muted tiny">Taille des parents</span><button class="btn sm ghost" data-act="kidForm" data-v="${c.id}">Ajouter pour affiner</button></div>`}
    ${pj.comb!=null?`<div class="stat"><span class="muted tiny">Estimation combinée</span><div class="v num" style="color:var(--lilac-ink)">${fmtNum(pj.comb,0)}<small>cm</small></div><span class="small muted">moyenne des deux couloirs</span></div>`:""}</div>
    <div class="chart-wrap">${s}</div>
    <div class="legend"><span><i style="background:var(--kid-ink)"></i>Mesures</span><span><i style="background:var(--kid);opacity:.4;height:8px"></i>Couloir actuel prolongé (80 %)</span>${pj.comb!=null?`<span><i style="background:var(--lilac-ink)"></i>Combinée</span>`:""}<span><i style="background:var(--soft)"></i>3e, 50e, 97e</span></div>

}

  [y, y+1].forEach(yy => { const d = new Date(yy, b.getMonth(), b.getDate()); if (d > b) ev.push({id:"b"+yy, date:iso(d), time:"", title:`Anniversaire de ${c.nick||c.name} · ${yy-b.getFullYear()} an${yy-b.getFullYear()>1?"s":""}`, type:"anniv", auto:true, kid:c}); });

function agenda(c){
  const base = UI.calMonth ? parseD(UI.calMonth) : new Date(today().getFullYear(), today().getMonth(), 1);
  const ev = S.children.flatMap(k => allEvents(k));
  const first = new Date(base.getFullYear(), base.getMonth(), 1), start = addDays(first, -((first.getDay()+6)%7));

function urgence(){
  const n = (l, num, sub, col) => `<div class="li"><div class="ic" style="background:var(--${col}-bg);color:var(--${col}-ink)">${icon("phone")}</div><div class="grow"><div class="small muted" style="font-weight:700">${l}</div><div class="phone num">${num}</div>${sub?`<div class="tiny muted">${sub}</div>`:""}</div><button class="btn sm ghost" data-act="copy" data-v="${num}" aria-label="Copier">${icon("copy")}</button><a class="btn sm ${col==="rose"?"danger":"ghost"}" href="tel:${num.replace(/[^0-9]/g,"")}">Appeler</a></div>`;
  sheet(`${sheetHead("Urgence et ressources")}
    <div class="banner alert">${icon("alert")}<div>Difficulté à respirer, lèvres bleues, convulsion, perte de conscience, étouffement : <b>911</b> immédiatement.</div></div>
    <div class="list">${n("Urgence","911","","rose")}${n("Info-Santé · Info-Social","811","Infirmière 24 h/24 (option 1), intervenant psychosocial (option 2)","sky")}${n("Centre antipoison du Québec","1-800-463-5060","24 h/24","butter")}${n("Tel-jeunes","1-800-263-2266","Pour les jeunes. Texto : 514-600-1002","lilac")}${n("LigneParents","1-800-361-5085","Soutien aux parents, 24 h/24","mint")}${n("Ligne de crise suicide","988","Appel ou texto, 24 h/24","rose")}</div>`);
}
function report(){
  const c = child(), m = ageMonths(c.dob), em = effAge(c), L = [];
  L.push(`RAPPORT DE SUIVI — ${c.name.toUpperCase()}`, `Préparé par le parent le ${fmtD(today(),{day:"numeric",month:"long",year:"numeric"})} avec Care`, ``);
  L.push(`Naissance : ${fmtD(c.dob)} · ${c.sex==="F"?"fille":"garçon"} · AG ${c.gaW} SA ${c.gaD||0} j`);
  L.push(`Âge : ${ageLabel(m)}${usesCorrected(c)?` (corrigé : ${ageLabel(em)})`:""}`);
  if (c.allergies) L.push(`ALLERGIES : ${c.allergies}`);
  if (c.conditions) L.push(`Problèmes de santé : ${c.conditions}`);
  if (c.meds) L.push(`Médicaments : ${c.meds}`);
  L.push(``, `— CROISSANCE (OMS${usesCorrected(c)?", âge corrigé":""}) —`);
  [...c.growth].sort((a,b)=>a.date<b.date?1:-1).slice(0,4).forEach(g => { const am = effAge(c, parseD(g.date));
    L.push(`${fmtD(g.date)} : ${["weight","height","ofc"].filter(k=>g[k]).map(k => { const z = zScore(k,c.sex,am,Number(g[k])); return `${MEAS[k].label} ${fmtNum(g[k],k==="weight"?2:1)} ${MEAS[k].unit}${z!=null?` (P${pctLabel(z)}, z ${z>=0?"+":""}${fmtNum(z,2)})`:""}`; }).join(" · ")}`); });
  const vel = heightVelocity(c); if (vel) L.push(`Vitesse de croissance : ${fmtNum(vel.v,1)} cm/an`);
  const mp = midParental(c); if (mp) L.push(`Taille cible parentale : ${fmtNum(mp.t,0)} cm (± 8,5)`);
  growthAlerts(c).forEach(a => L.push(a.out ? `! ${MEAS[a.meas].label} hors 3e-97e percentile` : `! ${MEAS[a.meas].label} : ${a.n} lignes de percentiles franchies à la ${a.dir} depuis le ${fmtD(a.from.date)}`));
  L.push(``, `— VACCINATION (PIQ) —`);
  PIQ.forEach(g => vaxStatus(c,g).forEach(d => { if (d.st!=="na" && (d.st!=="avenir" || g.age <= m+6)) L.push(`${g.label} · ${d.name} : ${VSTAT[d.st][1]}${d.rec?` le ${fmtD(d.rec.date)}${d.rec.lot?`, lot ${d.rec.lot}`:""}${d.rec.reactions?`, réaction : ${d.rec.reactions}`:""}`:""}`); }));
  if (em < 78 && mod(c,"milestones")){
    L.push(``, `— DÉVELOPPEMENT —`);
    const late = MS.filter(it => it.al && em > it.al && !c.milestones[it.k]);
    L.push(late.length ? `Non acquis après l'âge d'alerte : ${late.map(i=>i.t).join(" ; ")}` : `Aucun jalon en retard selon le parent.`);
    Object.entries(DOMAINS).forEach(([d,D]) => { const exp = MS.filter(it => it.d===d && it.b <= em); if (exp.length) L.push(`${D.short} : ${exp.filter(it=>c.milestones[it.k]).length}/${exp.length} jalons attendus acquis`); });
  }
  const g = guide(m), wk = Array.from({length:7},(_,i)=>dayTotals(c, addDays(today(), -i)));
  const avg = k => wk.reduce((s,t)=>s+t[k],0)/7;
  L.push(``, `— HABITUDES (moyenne 7 jours) —`, `Sommeil ${fmtNum(avg("sleep")/60,1)} h (cible ${g.sleep[0]}-${g.sleep[1]}) · activité ${fmtMin(avg("act"))} · écran ${fmtMin(avg("screen"))} · lecture ${fmtMin(avg("read"))}`);
  const last7 = c.logs.filter(l => Date.now()-l.t < 7*DAY), temps = last7.filter(l=>l.type==="temp"), meds = last7.filter(l=>l.type==="med");
  if (temps.length || meds.length){ L.push(``, `— FIÈVRE ET MÉDICAMENTS, 7 JOURS —`);
    temps.forEach(l => L.push(`${fmtD(new Date(l.t),{day:"numeric",month:"short"})} ${fmtT(l.t)} · ${fmtNum(l.data.temp)} °C (${l.data.site})`));
    meds.forEach(l => L.push(`${fmtD(new Date(l.t),{day:"numeric",month:"short"})} ${fmtT(l.t)} · ${l.data.name}${l.data.dose?` ${l.data.dose}`:""}`)); }
  L.push(``, `Questions du parent :`, `………………………………………………`);
  UI.reportTxt = L.join("\n");
  sheet(`${sheetHead("Rapport pour la visite")}<p class="small muted">Copiez-le dans un courriel ou montrez l'écran au médecin.</p><div class="pre" id="reportTxt">${esc(UI.reportTxt)}</div><button class="btn kid" data-act="copy" data-v="__report">${icon("copy")}Copier le rapport</button>`);
}
function dataSheet(){
  sheet(`${sheetHead("Mes données")}
    <div class="banner info">${icon("info")}<div>Les données restent <b>dans ce navigateur, sur cet appareil</b>. Rien n'est envoyé ailleurs. Copiez une sauvegarde régulièrement.</div></div>
    <button class="btn ghost" data-act="copy" data-v="__backup">${icon("copy")}Copier une sauvegarde (texte)</button>
    ${fld("imp","Restaurer une sauvegarde",`<textarea class="inp" id="imp" placeholder="Collez la sauvegarde ici"></textarea>`)}
    <div class="row"><button class="btn ghost" data-act="import">Restaurer</button><label class="btn line" style="cursor:pointer">Importer un fichier<input type="file" id="impFile" accept=".json,.txt,application/json" hidden></label></div>
    <div class="sep"></div><button class="btn danger" data-act="askWipe">Tout effacer</button><div id="wipeConfirm"></div>`);
}

/* ---------- actions ---------- */
let toastT;
function toast(msg){ clearTimeout(toastT); let el = $("#toast"); if (!el){ el = document.createElement("div"); el.id="toast"; el.className="toast"; el.setAttribute("role","status"); document.body.appendChild(el); } el.textContent = msg; el.hidden = false; toastT = setTimeout(()=>el.hidden = true, 2200); }
function commit(msg){ save(); render(); if (msg) toast(msg); }
function copyText(t){
  const fb = () => { const el = $("#reportTxt"); if (el){ const r = document.createRange(); r.selectNodeContents(el); const s = getSelection(); s.removeAllRanges(); s.addRange(r); toast("Texte sélectionné, copiez-le"); } else toast("Copie impossible ici"); };
  try { navigator.clipboard.writeText(t).then(()=>toast("Copié"), fb); } catch(e){ fb(); }
}
document.addEventListener("click", e => {
  const b = e.target.closest("[data-act]"); if (!b) return;
  const a = b.dataset.act, v = b.dataset.v, c = child();
  if (a === "closeSheet"){ if (e.target === b || b.tagName === "BUTTON") { close(); if (UI.view) render(); } return; }
  switch(a){
    case "nav": UI.view = v; close(); try{ history.replaceState(null,"","#"+v); }catch(err){} render(); window.scrollTo({top:0}); break;
    case "go": UI.view = v; UI.sub.sante = b.dataset.s; render(); window.scrollTo({top:0}); break;
    case "kid": S.active = v; UI.range = null; commit(); break;
    case "kidForm": kidForm(v); break;
    case "modules": modulesSheet(); break;
    case "resetModules": c.modules = {}; save(); modulesSheet(); toast("Choix selon l'âge rétablis"); break;
    case "clearDemo": S = {children:[], active:null, demo:false, timer:null, theme:S.theme}; save(); render(); kidForm(); break;
    case "log": logForm(v); break;
    case "startTimer": { const side = (document.querySelector('input[name="mode"]:checked')||{}).value || "";
      S.timer = {kid:c.id, type:v, start:Date.now(), side: side === "Biberon" ? "Sein gauche" : side}; close(); commit(v==="sleep"?"Bonne nuit":"Minuterie lancée"); break; }
    case "stopTimer": { const t = S.timer; c.logs.push({id:uid(), type:t.type, t:t.start, end:Date.now(), data: t.type==="feed"?{mode:t.side}:{}}); S.timer = null; commit("Noté"); break; }
    case "delLog": c.logs = c.logs.filter(l => l.id !== v); commit("Supprimé"); break;
    case "allergen": c.allergensLog = c.allergensLog || {}; (c.allergensLog[v] = c.allergensLog[v] || []).push(iso(today())); commit(`${v} : exposition notée`); break;
    case "growthForm": growthForm(); break;
    case "delGrowth": c.growth = c.growth.filter(g => g.id !== v); commit("Mesure supprimée"); break;
    case "meas": UI.sub.courbes = v; UI.range = null; render(); break;
    case "range": UI.range = v; drawChart(c); break;
    case "chrono": UI.chrono = v === "1"; render(); break;
    case "sub": UI.sub.sante = v; render(); break;
    case "msMode": UI.msMode = v; render(); break;
    case "msAll": UI.msAll = !UI.msAll; render(); break;
    case "ms": if (c.milestones[v]) delete c.milestones[v]; else c.milestones[v] = iso(today()); save(); render(); break;
    case "tipCat": { c.hideTips = c.hideTips || []; c.hideTips = c.hideTips.includes(v) ? c.hideTips.filter(x=>x!==v) : [...c.hideTips, v]; commit(); break; }
    case "vaxForm": vaxForm(v); break;
    case "delVax": delete c.vaccines[v]; close(); commit("Retiré"); break;
    case "tooth": { const base = v.slice(0,-1); if (c.teeth[base]){ c.teeth[base+"L"]=c.teeth[base]; c.teeth[base+"R"]=c.teeth[base]; delete c.teeth[base]; } if (c.teeth[v]) delete c.teeth[v]; else c.teeth[v] = iso(today()); commit(); break; }
    case "eventForm": eventForm(v); break;
    case "activityForm": activityForm(); break;
    case "delActivity": c.activities = c.activities.filter(x => x.id !== v); commit("Retiré"); break;
    case "delEvent": S.children.forEach(k => k.events = k.events.filter(x => x.id !== v)); commit("Supprimé"); break;
    case "day": UI.calSel = v; render(); break;
    case "calNav": { const base = UI.calMonth ? parseD(UI.calMonth) : new Date(today().getFullYear(), today().getMonth(), 1); UI.calMonth = iso(new Date(base.getFullYear(), base.getMonth()+Number(v), 1)); render(); break; }
    case "firstForm": firstForm(); break;
    case "delFirst": c.firsts = c.firsts.filter(f => f.id !== v); commit(); break;
    case "urgence": urgence(); break;
    case "report": report(); break;
    case "data": dataSheet(); break;
    case "theme": S.theme = S.theme == null ? "light" : S.theme === "light" ? "dark" : null; commit(S.theme==="dark"?"Thème sombre":S.theme==="light"?"Thème clair":"Thème automatique"); break;
    case "rmPhoto": UI.photoDraft = null; $("#photoPrev").innerHTML = avatar({...c, photo:null}, 72); b.remove(); break;
    case "copy": copyText(v === "__report" ? UI.reportTxt : v === "__backup" ? JSON.stringify(S) : v); break;
    case "import": try { const d = JSON.parse($("#imp").value); if (!Array.isArray(d.children)) throw 0; S = d; S.children.forEach(k => { const bl = blankKid(); for (const x in bl) if (k[x] === undefined) k[x] = bl[x]; }); close(); commit("Sauvegarde restaurée"); } catch(err){ toast("Ce texte n'est pas une sauvegarde Care"); } break;
    case "askWipe": $("#wipeConfirm").innerHTML = `<div class="banner alert" style="margin-top:8px"><div>Effacer tous les enfants et toutes les données de cet appareil ? <div class="row" style="margin-top:8px"><button class="btn sm danger" data-act="wipe">Oui, tout effacer</button></div></div></div>`; break;
    case "wipe": S = {children:[], active:null, demo:false, timer:null, theme:S.theme}; close(); commit("Données effacées"); break;
    case "askDelKid": $("#delConfirm").innerHTML = `<div class="banner alert"><div>Supprimer ce profil et toutes ses données ? <div class="row" style="margin-top:8px"><button type="button" class="btn sm danger" data-act="delKid" data-v="${v}">Oui, supprimer</button></div></div></div>`; break;
    case "delKid": S.children = S.children.filter(k => k.id !== v); S.active = S.children[0]?.id || null; close(); commit("Profil supprimé"); break;
  }
});
document.addEventListener("change", e => {
  const t = e.target;
  if (t.id === "impFile" && t.files[0]){ const r = new FileReader(); r.onload = () => { $("#imp").value = r.result; }; r.readAsText(t.files[0]); }
  if (t.dataset.mod){ const c = child(); c.modules[t.dataset.mod] = t.checked; save(); render(); }
  if (t.id === "k-photo" && t.files[0]){
    // Réduit la photo à 192 px (JPEG) pour garder le stockage léger
    const r = new FileReader();
    r.onload = () => { const img = new Image(); img.onload = () => {
      const s = 192, cv = document.createElement("canvas"); cv.width = cv.height = s; const ctx = cv.getContext("2d");
      const k = Math.max(s/img.width, s/img.height), w = img.width*k, h = img.height*k; ctx.drawImage(img, (s-w)/2, (s-h)/2, w, h);
      UI.photoDraft = cv.toDataURL("image/jpeg", 0.82); $("#photoPrev").innerHTML = `<img class="avatar" src="${UI.photoDraft}" alt="" style="width:72px;height:72px">`;
    }; img.src = r.result; }; r.readAsDataURL(t.files[0]);
  }
});
const val = id => { const el = document.getElementById(id); return el ? el.value.trim() : ""; };
const radio = n => (document.querySelector(`input[name="${n}"]:checked`)||{}).value || "";
const tsOf = id => { const v = val(id); return v ? new Date(v).getTime() : Date.now(); };
document.addEventListener("submit", e => {
  const f = e.target.closest("form[data-form]"); if (!f) return;
  e.preventDefault();
  const c = child(), kind = f.dataset.form;
  if (kind === "log"){
    const type = f.dataset.type, t = tsOf("f-t"); let data = {}, end;
    const mins = Number(val("f-min"))||0;
    if (type === "feed"){ data = {mode:radio("mode"), ml:val("f-ml")}; if (mins) end = t + mins*6e4; }
    if (type === "sleep"){ end = tsOf("f-end"); if (end <= t){ toast("La fin doit être après le début"); return; } }
    if (type === "diaper") data = {kind:radio("kind"), note:val("f-note")};
    if (type === "solid"){ data = {food:val("f-food"), allergen:val("f-al"), reaction:val("f-re")}; if (data.allergen){ (c.allergensLog[data.allergen] = c.allergensLog[data.allergen]||[]).push(iso(new Date(t))); } }
    if (type === "temp"){ const v = Number(val("f-temp").replace(",",".")); if (!(v >= 34 && v <= 43)){ toast("Entrez une température entre 34 et 43 °C"); return; } data = {temp:v, site:radio("site")}; }
    if (type === "med"){ if (!val("f-name")){ toast("Indiquez le médicament"); return; } data = {name:val("f-name"), dose:val("f-dose")}; }
    if (type === "mood") data = {mood:radio("mood"), note:val("f-note")};
    if (["screen","tummy","read","activity"].includes(type) && !mins){ toast("Indiquez le nombre de minutes"); return; }
    if (type === "screen" || type === "tummy") data = {min:mins};
    if (type === "read") data = {min:mins, title:val("f-title")};
    if (type === "activity") data = {what:val("f-what"), min:mins, intensity:radio("intensity")};
    if (type === "note"){ if (!val("f-text")) { toast("Écrivez une note"); return; } data = {text:val("f-text")}; }
    c.logs.push({id:uid(), type, t, end, data}); close(); commit("Noté");
  }
  if (kind === "growth"){
    const w = Number(val("g-w").replace(",",".")), h = Number(val("g-h").replace(",",".")), oc = Number(val("g-c").replace(",","."));
    if (!w && !h && !oc){ toast("Entrez au moins une mesure"); return; }
    if (parseD(val("g-date")) < parseD(c.dob)){ toast("La date est avant la naissance"); return; }
    c.growth.push({id:uid(), date:val("g-date"), weight:w||null, height:h||null, ofc:oc||null}); close(); commit("Mesure ajoutée");
  }
  if (kind === "kid"){
    const id = f.dataset.id;
    const looks = {"Selon l'âge":"auto","Bébé":"nour","Bambin":"bamb","Préscolaire":"pres","Scolaire":"scol","Ado":"ado"};
    const d = {name:val("k-name"), nick:val("k-nick"), dob:val("k-dob"), sex: radio("sex")==="Garçon"?"M":"F", gaW:Number(val("k-gaw"))||40, gaD:Number(val("k-gad"))||0,
      color:radio("color")||"mint", look:looks[radio("look")]||"auto", photo:UI.photoDraft||null, hFather:Number(val("k-hf"))||null, hMother:Number(val("k-hm"))||null,
      allergies:val("k-al"), conditions:val("k-co"), meds:val("k-me"), doctor:val("k-dr"), pharmacy:val("k-ph")};
    if (!d.name || !d.dob){ toast("Prénom et date de naissance requis"); return; }
    if (id) Object.assign(S.children.find(k=>k.id===id), d);
    else { const k = {...blankKid(), id:uid(), ...d}; S.children.push(k); S.active = k.id; }
    close(); commit(id ? "Profil mis à jour" : `Bienvenue ${d.nick||d.name}`);
  }
  if (kind === "vax"){ c.vaccines[f.dataset.id] = {date:val("v-date"), lot:val("v-lot"), site:radio("site"), reactions:val("v-re")}; close(); commit("Vaccin noté"); }
  if (kind === "event"){
    const type = Object.entries(EVT).find(([,v]) => v[1] === radio("type"))?.[0] || "autre";
    S.children.find(x => x.id === (val("e-kid") || S.active)).events.push({id:uid(), date:val("e-date"), time:val("e-time"), title:val("e-title"), type});
    UI.calSel = val("e-date"); close(); commit("Ajouté à l'agenda");
  }
  if (kind === "activity"){
    const days = [...document.querySelectorAll('input[name="days"]:checked')].map(i => Number(i.value));
    if (!days.length){ toast("Choisissez au moins un jour"); return; }
    c.activities.push({id:uid(), name:val("a-name"), days, time:val("a-time"), place:val("a-place")}); close(); commit("Activité ajoutée");
  }
  if (kind === "first"){ c.firsts.push({id:uid(), title:val("p-title"), date:val("p-date")||iso(today()), note:val("p-note")}); close(); commit("Souvenir ajouté"); }
});
document.addEventListener("keydown", e => { if (e.key === "Escape") close(); });
setInterval(() => { const el = $("#timerVal"); if (el && S.timer) el.textContent = fmtDur(Date.now() - S.timer.start); }, 15000);
render();
</script>

if ("serviceWorker" in navigator && location.protocol === "https:" && !/localhost$/.test(location.hostname)) {
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
}
</script>
