# Compile l'APK Android à chaque modification et le publie dans « Releases ».
name: APK Android
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - name: Dépendances
        run: npm install
      - name: Projet Android
        run: |
          npx cap add android
          npx capacitor-assets generate --android
          npx cap sync android
      - name: Compiler l'APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Renommer
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Care.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Care-apk
          path: Care.apk
      - name: Publier dans Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest Care.apk --title "Care (dernière version)" --notes "APK Android compilé automatiquement à partir de la branche main. Installez-le sur votre téléphone (autoriser les sources inconnues)."
