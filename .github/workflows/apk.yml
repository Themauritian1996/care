# Compile l'APK Android de Tribe à chaque modification et le publie dans « Releases ».
name: APK Android
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Dépendances
        run: |
          npm install
          # Connexion Google native : seulement si google-services.json est fourni
          if [ -f android-config/google-services.json ]; then npm install @capacitor-firebase/authentication@7.5.0 firebase@11.10.0; fi
      - name: Clé de signature (secret GitHub, jamais dans le code)
        env:
          KS: ${{ secrets.TRIBE_KEYSTORE }}
        run: |
          if [ -n "$KS" ]; then printf '%s' "$KS" | tr -cd 'A-Za-z0-9+/=' | base64 -d > android-config/tribu.keystore; echo "Clé de signature trouvée"; else echo "Aucune clé : APK de test signé avec une clé temporaire"; fi
      - name: Projet Android
        run: |
          npx cap add android
          # Synthèse vocale (Android 11+) et rappels à l'heure exacte
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#</manifest>#    <queries><intent><action android:name="android.intent.action.TTS_SERVICE" /></intent></queries>\n</manifest>#' $M
          grep -q SCHEDULE_EXACT_ALARM $M || sed -i 's#<application#<uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />\n    <application#' $M
          npx capacitor-assets generate --android --iconBackgroundColor '#F0789C' --splashBackgroundColor '#F6F4FB'
          if [ -f android-config/google-services.json ]; then
            cp android-config/google-services.json android/app/
            printf '\next {\n    rgcfaIncludeGoogle = true\n}\n' >> android/variables.gradle
          fi
          # Version qui augmente à chaque compilation (les mises à jour s'installent par-dessus)
          sed -i "s/versionCode 1$/versionCode ${{ github.run_number }}/; s/versionName \"1.0\"/versionName \"3.0.${{ github.run_number }}\"/" android/app/build.gradle
          # Signature fixe (même clé à chaque compilation), seulement si la clé secrète est fournie
          if [ -f android-config/tribu.keystore ]; then
          cat >> android/app/build.gradle <<'GRADLE'

          // TRIBE-SIGN-START
          android {
              signingConfigs {
                  tribe {
                      storeFile file("${rootDir}/../android-config/tribu.keystore")
                      storePassword System.getenv("TRIBE_KEY_PASS")
                      keyAlias "tribu"
                      keyPassword System.getenv("TRIBE_KEY_PASS")
                  }
              }
              buildTypes {
                  release { signingConfig signingConfigs.tribe }
                  debug { signingConfig signingConfigs.tribe }
              }
          }
          // TRIBE-SIGN-END
          GRADLE
          fi
          npx cap sync android
      - name: Compiler l'APK
        working-directory: android
        shell: bash
        env:
          TRIBE_KEY_PASS: ${{ secrets.TRIBE_KEY_PASS }}
        run: |
          set +e +o pipefail
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew
          report(){ { grep -A8 "What went wrong" build.log || tail -30 build.log; } | head -20 | while IFS= read -r l; do echo "::error::$l"; done; }
          if [ -f ../android-config/tribu.keystore ]; then
            export TRIBE_KEY_PASS="$(printf '%s' "$TRIBE_KEY_PASS" | tr -d '\r\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
            if ! keytool -list -keystore ../android-config/tribu.keystore -storepass "$TRIBE_KEY_PASS" -alias tribu >/dev/null 2>&1; then
              echo "::warning::Clé de signature illisible : vérifiez TRIBE_KEYSTORE (toute la longue ligne base64) et TRIBE_KEY_PASS. APK de test produit en attendant."
              rm -f ../android-config/tribu.keystore
              sed -i '/TRIBE-SIGN-START/,/TRIBE-SIGN-END/d' app/build.gradle
            fi
          fi
          if [ -f ../android-config/tribu.keystore ]; then
            ./gradlew assembleRelease --no-daemon -x lintVitalRelease -x lintVitalAnalyzeRelease -x lintVitalReportRelease 2>&1 | tee build.log; [ ${PIPESTATUS[0]} -eq 0 ] || { report; exit 1; }
            A=$(find app/build/outputs/apk/release -name '*.apk' | head -1); echo "APK : $A"; [ -n "$A" ] || { echo "::error::Aucun APK release produit : $(ls -R app/build/outputs/apk | tr '\n' ' ')"; exit 1; }
            cp "$A" ../Tribe.apk
          else
            ./gradlew assembleDebug --no-daemon 2>&1 | tee build.log; [ ${PIPESTATUS[0]} -eq 0 ] || { report; exit 1; }
            cp app/build/outputs/apk/debug/app-debug.apk ../Tribe.apk
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: Tribe-apk
          path: Tribe.apk
      - name: Publier dans Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest Tribe.apk --title "Tribe (dernière version)" --notes "APK Android compilé automatiquement. Installez-le sur votre téléphone (autoriser les sources inconnues). Les mises à jour s'installent par-dessus la version précédente."
